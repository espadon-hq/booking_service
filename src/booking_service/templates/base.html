<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Booking{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Inter", sans-serif; background: #fff; color: #111; font-size: 15px; }

        nav { border-bottom: 1px solid #eee; padding: 18px 0; }
        .nav-inner { max-width: 960px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-weight: 600; font-size: 15px; text-decoration: none; color: #111; letter-spacing: .5px; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: #666; font-size: 14px; }
        .nav-links a:hover { color: #111; }

        .container { max-width: 960px; margin: 0 auto; padding: 48px 24px; }

        h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        h3 { font-size: 18px; font-weight: 500; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
        .filter-btn { padding: 7px 16px; border: 1px solid #ddd; background: #fff; border-radius: 20px; font-size: 13px; cursor: pointer; text-decoration: none; color: #444; transition: all .15s; }
        .filter-btn:hover { border-color: #111; color: #111; }
        .filter-btn.active { background: #111; color: #fff; border-color: #111; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

        .card { border: 1px solid #eee; border-radius: 10px; overflow: hidden; transition: border-color .15s; }
        .card:hover { border-color: #bbb; }
        .card-body { padding: 20px; }
        .card-footer { padding: 16px 20px; border-top: 1px solid #f0f0f0; }

        .hotel-name { font-size: 16px; font-weight: 600; margin: 6px 0 4px; }
        .hotel-location { font-size: 13px; color: #888; margin-bottom: 8px; }
        .hotel-desc { font-size: 13px; color: #555; line-height: 1.5; }
        .stars { font-size: 11px; color: #f0a500; letter-spacing: 1px; }

        .btn { display: inline-block; padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; border: none; transition: all .15s; }
        .btn-dark { background: #111; color: #fff; }
        .btn-dark:hover { background: #333; }
        .btn-outline { background: #fff; color: #111; border: 1px solid #ddd; }
        .btn-outline:hover { border-color: #111; }
        .btn-danger-outline { background: #fff; color: #c0392b; border: 1px solid #f0c0bb; font-size: 12px; padding: 6px 14px; }
        .btn-danger-outline:hover { background: #fff5f5; }
        .btn-full { width: 100%; text-align: center; }

        .date-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 20px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 28px; }
        .date-bar label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-bottom: 5px; }
        .date-bar input { border: 1px solid #ddd; border-radius: 7px; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; }
        .date-bar input:focus { border-color: #111; }

        .rooms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 600px) { .rooms-grid { grid-template-columns: 1fr; } }

        .room-card { border: 1px solid #eee; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .room-card.unavailable { opacity: .45; }
        .room-type { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; }
        .room-price { font-size: 20px; font-weight: 600; }
        .room-price span { font-size: 13px; font-weight: 400; color: #888; }
        .room-total { font-size: 13px; color: #2d7a4f; font-weight: 500; }
        .room-meta { font-size: 13px; color: #888; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .3px; }
        .badge-green { background: #e6f4ee; color: #2d7a4f; }
        .badge-red { background: #fde8e6; color: #c0392b; }
        .badge-gray { background: #f0f0f0; color: #888; }

        .back-link { font-size: 13px; color: #888; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 28px; }
        .back-link:hover { color: #111; }

        .page-title { margin-bottom: 4px; }
        .divider { border: none; border-top: 1px solid #eee; margin: 28px 0; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; padding: 10px 12px; border-bottom: 1px solid #eee; }
        td { padding: 14px 12px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; padding: 28px; width: 100%; max-width: 420px; margin: 16px; }
        .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-bottom: 5px; }
        .field input { width: 100%; border: 1px solid #ddd; border-radius: 7px; padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; }
        .field input:focus { border-color: #111; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .total-box { background: #f8f8f8; border-radius: 7px; padding: 12px 16px; font-size: 13px; margin-top: 4px; }

        footer { border-top: 1px solid #eee; padding: 24px; text-align: center; font-size: 12px; color: #bbb; margin-top: 80px; }
    </style>
</head>
<body>
<nav>
    <div class="nav-inner">
        <a class="nav-logo" href="/">Booking</a>
        <div class="nav-links">
            <a href="/">Готелі</a>
            <a href="/ui/bookings">Бронювання</a>
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
<footer>Booking Service &mdash; Лабораторна робота</footer>

<script>
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
function applyDates() {
    const ci = document.getElementById("ci").value;
    const co = document.getElementById("co").value;
    if (!ci || !co) { alert("Оберіть обидві дати"); return; }
    if (co <= ci) { alert("Дата виїзду має бути після заїзду"); return; }
    window.location.href = "?check_in=" + ci + "&check_out=" + co;
}
</script>
</body>
</html>
